<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中国地图闯关 Pro</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #162235;
        --muted: #65758b;
        --line: #dbe6ef;
        --paper: #ffffff;
        --soft: #f3f8f6;
        --brand: #12835f;
        --brand-dark: #0b664a;
        --brand-soft: #dff5ec;
        --warn: #b7791f;
        --bad: #c24135;
        --good: #16825d;
        --shadow: 0 18px 45px rgba(20, 50, 80, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, rgba(18, 131, 95, 0.16), transparent 30%),
          linear-gradient(135deg, #f7fbf7 0%, #edf6fb 100%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        width: min(1440px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 22px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .title h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0;
      }

      .title p {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .scope-switch {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 12px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
      }

      .scope-btn {
        min-height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-weight: 800;
      }

      .scope-btn.active {
        color: #fff;
        background: linear-gradient(135deg, var(--brand), #20a06f);
        box-shadow: 0 8px 18px rgba(18, 131, 95, 0.22);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .pill {
        min-width: 96px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 8px 20px rgba(20, 50, 80, 0.06);
      }

      .pill strong {
        display: block;
        font-size: 18px;
      }

      .pill span {
        color: var(--muted);
        font-size: 12px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(680px, 1fr) 380px;
        gap: 18px;
        align-items: stretch;
      }

      .panel {
        border: 1px solid rgba(219, 230, 239, 0.9);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .map-panel {
        min-height: calc(100vh - 120px);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .tab,
      .ghost,
      .primary {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font-weight: 700;
      }

      .tab.active,
      .primary {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }

      select,
      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 0 12px;
        outline: none;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(18, 131, 95, 0.16);
      }

      .map-wrap {
        position: relative;
        height: calc(100vh - 220px);
        min-height: 610px;
        background:
          linear-gradient(rgba(18, 131, 95, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(18, 131, 95, 0.045) 1px, transparent 1px),
          #f8fcfb;
        background-size: 44px 44px;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .province {
        fill: #e5f2ea;
        stroke: #9ab7ad;
        stroke-width: 0.8;
        vector-effect: non-scaling-stroke;
        cursor: pointer;
        transition: fill 140ms ease, filter 140ms ease;
      }

      .province:hover,
      .province.focused {
        fill: #bfe7d3;
        filter: drop-shadow(0 5px 7px rgba(12, 70, 50, 0.16));
      }

      .province.correct {
        fill: #47c98f;
      }

      .province.wrong {
        fill: #ef8a7d;
      }

      .province.learned {
        fill: #d9efe5;
      }

      .zoom {
        position: absolute;
        right: 16px;
        top: 16px;
        display: grid;
        gap: 8px;
      }

      .zoom button {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 20px rgba(20, 50, 80, 0.12);
        cursor: pointer;
        font-weight: 800;
      }

      .side {
        display: grid;
        gap: 14px;
      }

      .card {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      .card:last-child {
        border-bottom: 0;
      }

      .question-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .question {
        margin: 8px 0 4px;
        font-size: 30px;
        line-height: 1.15;
      }

      .sub {
        color: var(--muted);
        line-height: 1.65;
      }

      .answer-row {
        display: grid;
        grid-template-columns: 1fr 92px;
        gap: 10px;
        margin-top: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }

      .result {
        min-height: 46px;
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
        line-height: 1.55;
      }

      .result.good {
        background: #e3f7ee;
        color: var(--good);
      }

      .result.bad {
        background: #fff0ed;
        color: var(--bad);
      }

      .knowledge h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .facts {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .fact {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f7faf9;
      }

      .fact b {
        color: var(--brand-dark);
      }

      .wrong-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 38px;
        margin-top: 10px;
      }

      .chip {
        border: 1px solid #f0d1ca;
        border-radius: 999px;
        background: #fff7f5;
        color: #a94235;
        padding: 7px 10px;
        cursor: pointer;
      }

      .shortcuts {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      kbd {
        display: inline-block;
        min-width: 24px;
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        text-align: center;
        font-weight: 700;
      }

      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--muted);
        text-align: center;
        background: rgba(248, 252, 251, 0.86);
      }

      .loading[hidden] {
        display: none;
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .map-panel {
          min-height: auto;
        }

        .map-wrap {
          height: 68vh;
          min-height: 520px;
        }
      }

      @media (max-width: 680px) {
        .app {
          width: min(100% - 18px, 1440px);
          padding: 12px 0;
        }

        .topbar,
        .toolbar {
          grid-template-columns: 1fr;
          display: grid;
        }

        .stats,
        .tabs {
          grid-template-columns: repeat(2, 1fr);
          display: grid;
        }

        .title h1 {
          font-size: 28px;
        }

        .map-wrap {
          min-height: 430px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">
          <h1>中国地图闯关 Pro</h1>
          <p id="subtitle">更适合电脑大屏的中国地理小游戏：点地图、猜省会、猜特色、自由学习。</p>
          <div class="scope-switch" aria-label="地图范围">
            <button class="scope-btn active" data-scope="china">全国省份</button>
            <button class="scope-btn" data-scope="sichuan">四川地市州</button>
          </div>
        </div>
        <div class="stats" aria-label="游戏状态">
          <div class="pill"><strong id="score">0</strong><span>得分</span></div>
          <div class="pill"><strong id="streak">0</strong><span>连对</span></div>
          <div class="pill"><strong id="progress">1/34</strong><span>进度</span></div>
          <div class="pill"><strong id="accuracy">0%</strong><span>正确率</span></div>
        </div>
      </header>

      <section class="layout">
        <section class="panel map-panel" aria-label="中国地图学习区">
          <div class="toolbar">
            <div class="tabs" role="tablist" aria-label="学习模式">
              <button class="tab active" data-mode="locate">找位置</button>
              <button class="tab" data-mode="capital" id="capitalTab">猜省会</button>
              <button class="tab" data-mode="feature">猜特色</button>
              <button class="tab" data-mode="free">自由学</button>
            </div>
            <select id="regionFilter" aria-label="地区筛选">
              <option value="all">全部地区</option>
              <option value="华北">华北</option>
              <option value="东北">东北</option>
              <option value="华东">华东</option>
              <option value="华中">华中</option>
              <option value="华南">华南</option>
              <option value="西南">西南</option>
              <option value="西北">西北</option>
              <option value="港澳台">港澳台</option>
            </select>
          </div>
          <div class="map-wrap">
            <svg id="map" viewBox="0 0 1000 760" role="img" aria-label="中国省级行政区地图"></svg>
            <div class="zoom" aria-label="地图缩放控制">
              <button id="zoomIn" title="放大">+</button>
              <button id="zoomOut" title="缩小">-</button>
              <button id="resetView" title="复位">⌂</button>
            </div>
            <div class="loading" id="loading">正在读取地图数据。如果长时间没有地图，请确认电脑能访问 GitHub Pages。</div>
          </div>
        </section>

        <aside class="panel side">
          <section class="card">
            <div class="question-label" id="questionLabel">请在地图上点出</div>
            <h2 class="question" id="question">甘肃</h2>
            <p class="sub" id="questionHelp">点击地图作答，也可以在输入框里输入省份名称。</p>
            <div class="answer-row">
              <input id="answer" placeholder="输入答案，如：广东" autocomplete="off">
              <button class="primary" id="submit">提交</button>
            </div>
            <div class="controls">
              <button class="ghost" id="next">下一题</button>
              <button class="ghost" id="hint">智能提示</button>
            </div>
            <div class="result" id="result">准备好了。电脑上可以直接用键盘：Enter 提交，N 下一题，H 提示。</div>
          </section>

          <section class="card knowledge">
            <h2 id="provinceTitle">点击任意省份</h2>
            <p class="sub" id="provinceIntro">查看省会、位置、景区、美食、名人和代表城市。</p>
            <div class="facts" id="facts"></div>
          </section>

          <section class="card">
            <b>错题本</b>
            <p class="sub" id="wrongHelp">答错的省份会出现在这里，点一下就能复习。</p>
            <div class="wrong-list" id="wrongList"></div>
          </section>

          <section class="card">
            <b>电脑快捷键</b>
            <div class="shortcuts">
              <span><kbd>Enter</kbd> 提交</span>
              <span><kbd>N</kbd> 下一题</span>
              <span><kbd>H</kbd> 提示</span>
              <span><kbd>Esc</kbd> 清空</span>
              <span><kbd>+</kbd> 放大</span>
              <span><kbd>-</kbd> 缩小</span>
            </div>
          </section>
        </aside>
      </section>
    </main>

      function normalizeName(name) {
        return aliases[name] || String(name || "")
          .replace(/藏族羌族自治州|藏族自治州|彝族自治州|壮族自治区|回族自治区|维吾尔自治区|特别行政区|自治区|自治州|省|市/g, "");

        return state.scope === "sichuan" ? sichuanInfo : provinceInfo;

        return Object.keys(currentInfoMap()).length;
      }

      function infoOf(name) {
        const key = normalizeName(name);
        const info = currentInfoMap()[key] || ["未知", "未知", "未知", "未知", "暂无资料", "未知"];
        return { name: key, capital: info[0], region: info[1], scenic: info[2], food: info[3], intro: info[4], cities: info[5] };
      }

      function availableNames() {
        return Object.keys(currentInfoMap()).filter((name) => state.region === "all" || infoOf(name).region === state.region);
      }

      function pickQuestion() {
        clearAutoNext();
        const names = availableNames();
        state.question = names[Math.floor(Math.random() * names.length)] || "甘肃";

        updateQuestion();
        clearMarks();
        els.answer.value = "";
        els.answer.focus();

      function updateQuestion() {
        const info = infoOf(state.question);

        } else if (state.mode === "feature") {
          els.questionLabel.textContent = state.scope === "sichuan" ? "根据线索猜市州" : "根据线索猜省份";

        } else {

      function updateStats() {
        els.score.textContent = state.score;

      function showProvince(name) {
        const info = infoOf(name);
        state.learned.add(info.name);
        els.title.textContent = info.name;
        els.intro.textContent = info.intro;
        els.facts.innerHTML = [
          [state.scope === "sichuan" ? "驻地" : "省会", info.capital],
          ["地区", info.region],
          ["景区", info.scenic],
          ["美食", info.food],
          [state.scope === "sichuan" ? "区县" : "城市", info.cities],
        ].map(([label, value]) => `<div class="fact"><b>${label}</b><span>${value}</span></div>`).join("");
        document.querySelectorAll(".province").forEach((node) => {
          node.classList.toggle("learned", state.learned.has(node.dataset.name));
          node.classList.toggle("focused", node.dataset.name === info.name);

      function markProvince(name, className) {
        document.querySelectorAll(".province").forEach((node) => {
          if (node.dataset.name === name) node.classList.add(className);

      function answerWith(value) {
        const guess = normalizeName(value.trim());
        if (!guess) return;
        if (state.autoNextTimer && state.mode !== "free") return;

        if (state.mode === "free") {
          showProvince(guess);
          setResult(`正在学习 ${guess}。`, "good");
          return;
        }

        const target = infoOf(state.question);
        const isCorrect = state.mode === "capital"
          ? guess === target.capital || normalizeName(guess) === target.name
          : guess === target.name;
        showProvince(isCorrect ? target.name : guess);

        state.answered += 1;
        if (isCorrect) {
          state.correct += 1;
          state.score += 10 + Math.min(state.streak, 5);
          state.streak += 1;
          markProvince(target.name, "correct");
          setResult(`答对了！${target.name}：${target.intro}`, "good");
        } else {
          state.streak = 0;
          state.wrong.add(target.name);
          markProvince(guess, "wrong");
          markProvince(target.name, "correct");
          setResult(`差一点。正确答案是 ${state.mode === "capital" ? target.capital : target.name}。`, "bad");
        }
        state.round += 1;
        renderWrongList();
        updateStats();
        scheduleAutoNext();
      }

      function pathsFromGeometry(geometry, project) {
        const polys = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;
        return polys.map((poly) => poly.map((ring) => ring.map(([lng, lat], index) => {
          const [x, y] = project(lng, lat);
          return `${index ? "L" : "M"}${x.toFixed(2)} ${y.toFixed(2)}`;
        }).join(" ") + " Z").join(" ")).join(" ");
      }

      function boundsOf(features) {
        const box = { minLng: Infinity, maxLng: -Infinity, minLat: Infinity, maxLat: -Infinity };
        const visit = (coords) => {
          if (typeof coords[0] === "number") {
            box.minLng = Math.min(box.minLng, coords[0]);
            box.maxLng = Math.max(box.maxLng, coords[0]);
            box.minLat = Math.min(box.minLat, coords[1]);
            box.maxLat = Math.max(box.maxLat, coords[1]);
          } else {
            coords.forEach(visit);
          }
        };
        features.forEach((feature) => visit(feature.geometry.coordinates));
        return box;
      }

      function featureDisplayName(feature) {
        const adcode = Number(feature.properties.adcode);
        return sichuanAdcodeNames[adcode] || normalizeName(feature.properties.name || feature.properties.fullname || feature.properties.NAME);
      }

      function renderMap(features, cacheKey = "chinaFeatures") {
        state[cacheKey] = features;
        const box = boundsOf(features);
        const width = 1000;
        const height = 760;
        const pad = 50;
        const scale = Math.min((width - pad * 2) / (box.maxLng - box.minLng), (height - pad * 2) / (box.maxLat - box.minLat));
        const project = (lng, lat) => [
          (lng - box.minLng) * scale + pad,
          height - ((lat - box.minLat) * scale + pad),
        ];
        const paths = features.map((feature) => {
          const name = featureDisplayName(feature);
          return `<path class="province" data-name="${name}" d="${pathsFromGeometry(feature.geometry, project)}"><title>${name}</title></path>`;
        }).join("");
        els.map.innerHTML = `<g id="mapLayer">${paths}</g>`;
        els.loading.hidden = true;
      }

      async function loadSichuanMap() {
        if (state.sichuanFeatures.length) {
          renderMap(state.sichuanFeatures, "sichuanFeatures");
          return;
        }
        els.loading.hidden = false;
        els.loading.textContent = "正在读取四川地市州地图数据...";
        try {
          const response = await fetch(SICHUAN_GEOJSON_URL);
          const geojson = await response.json();
          renderMap(geojson.features || [], "sichuanFeatures");
        } catch (error) {
          els.loading.textContent = "四川地图数据读取失败。请确认仓库中有 sichuan-prefectures.geojson。";
        }
      }

        els.map.setAttribute("aria-label", scope === "sichuan" ? "四川地市州学习地图" : "中国省级行政区地图");
        els.facts.innerHTML = "";
        setResult(scope === "sichuan" ? "已切换到四川地市州闯关。按 N 下一题，按 H 要提示。" : "已切换到全国省份闯关。");
        if (scope === "sichuan") {
          loadSichuanMap();
        } else if (state.chinaFeatures.length) {
          renderMap(state.chinaFeatures, "chinaFeatures");
        }
        pickQuestion();
      }

      function setScale(nextScale) {
        state.scale = Math.max(0.8, Math.min(2.2, nextScale));
        const layer = document.querySelector("#mapLayer");
        if (layer) {
          const offset = (1 - state.scale) * 500;
          layer.setAttribute("transform", `translate(${offset} ${offset * 0.76}) scale(${state.scale})`);
        }
      }

      async function boot() {
        try {
          const response = await fetch(CHINA_GEOJSON_URL);
          const geojson = await response.json();
          renderMap(geojson.features || [], "chinaFeatures");
        } catch (error) {
          els.loading.textContent = "地图数据读取失败。请检查网络，或从 GitHub 仓库下载 china-provinces.geojson 放到本文件旁边。";
        }
        renderWrongList();
        updateRegionOptions();
        pickQuestion();
      }

      document.addEventListener("click", (event) => {
        const province = event.target.closest(".province");
        if (province) answerWith(province.dataset.name);
        const tab = event.target.closest(".tab");
        if (tab) {
          state.mode = tab.dataset.mode;
          document.querySelectorAll(".tab").forEach((node) => node.classList.toggle("active", node === tab));
          pickQuestion();
          setResult(state.mode === "free" ? `自由学习模式：点击任意${state.scope === "sichuan" ? "地市州" : "省份"}查看知识卡。` : "已切换模式，开始新题。");
        }
        const scopeButton = event.target.closest(".scope-btn");
        if (scopeButton) {
          setScope(scopeButton.dataset.scope);
        }
        const review = event.target.closest("[data-review]");
        if (review) showProvince(review.dataset.review);
      });

      els.submit.addEventListener("click", () => answerWith(els.answer.value));
      els.next.addEventListener("click", pickQuestion);
      els.hint.addEventListener("click", smartHint);
      els.regionFilter.addEventListener("change", () => {
        state.region = els.regionFilter.value;
        pickQuestion();
      });
      document.querySelector("#zoomIn").addEventListener("click", () => setScale(state.scale + 0.18));
      document.querySelector("#zoomOut").addEventListener("click", () => setScale(state.scale - 0.18));
      document.querySelector("#resetView").addEventListener("click", () => setScale(1));
      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter") answerWith(els.answer.value);
        if (event.key.toLowerCase() === "n") pickQuestion();
        if (event.key.toLowerCase() === "h") smartHint();
        if (event.key === "Escape") els.answer.value = "";
        if (event.key === "+" || event.key === "=") setScale(state.scale + 0.18);
        if (event.key === "-") setScale(state.scale - 0.18);
      });

      boot();
    </script>
  </body>
</html>
